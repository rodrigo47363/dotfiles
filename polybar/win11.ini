;==========================================================
;   POLYBAR CONFIG - WINDOWS 11 TASKBAR (FLUENT MICA)
;   Pixel-perfect bottom-docked Windows 11 taskbar replication
;==========================================================

[colors]
background      = #181818f2
background-alt  = #242424
background-card = #2f2f2f
foreground      = #ffffff
foreground-alt  = #cfcfcf
foreground-dim  = #8a8a8a

accent          = #00a4ef
fluent-blue     = #60cdff
fluent-glow     = #4cc2ff
alert           = #ff99a4
green           = #6ccb5f
white           = #ffffff

[bar/win11]
width = 100%
height = 34pt
radius = 0
bottom = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt
line-color = ${colors.fluent-blue}

border-top-size = 1pt
border-top-color = #2e2e2e

padding-left = 1
padding-right = 1
module-margin = 0

wm-restack = bspwm
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

; --- FUENTES OFICIALES WINDOWS 11 & ICONOS ---
font-0 = "Segoe UI Variable:size=10:weight=semibold;2"
font-1 = "Hack Nerd Font:size=11;2"
font-2 = "Segoe Fluent Icons:size=11;2"
font-3 = "Hack Nerd Font:size=13;3"

; --- DISTRIBUCIÓN ESTILO WINDOWS 11 (CENTRO & EXTREMOS) ---
modules-left = win11-widgets win11-stealth
modules-center = win-start win11-search win11-taskview win11-bspwm win11-dock-sep win11-explorer win11-terminal win11-browser win11-code win11-dock-sep win11-active
modules-right = tray-chevron systray sep-pill wlan pulseaudio battery sep-pill win11-clock win11-notifications win11-show-desktop

;==========================================================
; 1. ZONA IZQUIERDA: WIDGETS & EL TIEMPO
;==========================================================

[module/win11-widgets]
type = custom/script
exec = ~/.config/polybar/scripts/win11-weather.sh
interval = 60
format-background = ${colors.background-alt}
format-foreground = ${colors.foreground}
format-padding = 1
click-left = ~/.config/polybar/scripts/win11-weather.sh click &
click-right = ~/.config/polybar/scripts/win11-weather.sh stealth &

[module/win11-stealth]
type = custom/script
exec = ip -o -4 addr show 2>/dev/null | grep -qE "tun|tap|wg" && echo " 󰌆 " || echo ""
interval = 5
format-foreground = ${colors.fluent-blue}
click-left = ~/.config/polybar/scripts/win11-weather.sh stealth &

;==========================================================
; 2. ZONA CENTRAL: DOCK WINDOWS 11 (START, SEARCH, PINNED)
;==========================================================

[module/win-start]
type = custom/text
label = " 󰍲 "
label-font = 4
label-foreground = ${colors.accent}
label-padding = 1
click-left = pkill -x rofi || rofi -show drun &

[module/win11-search]
type = custom/text
label = " %{T3}%{T-}  Buscar "
label-foreground = ${colors.foreground-dim}
label-background = ${colors.background-alt}
label-padding = 1
click-left = pkill -x rofi || rofi -show drun &

[module/win11-taskview]
type = custom/text
label = " 󱂬 "
label-font = 2
label-foreground = ${colors.foreground-alt}
label-padding = 1
click-left = pkill -x rofi || rofi -show window &

[module/win11-bspwm]
type = internal/bspwm

pin-workspaces = true
inline-mode = false
enable-click = true
enable-scroll = true
reverse-scroll = false

ws-icon-0 = I;1
ws-icon-1 = II;2
ws-icon-2 = III;3
ws-icon-3 = IV;4
ws-icon-4 = V;5
ws-icon-5 = VI;6
ws-icon-6 = VII;7
ws-icon-7 = VIII;8
ws-icon-8 = IX;9
ws-icon-9 = X;10

format = <label-state>

label-focused = " %icon% "
label-focused-foreground = ${colors.white}
label-focused-background = ${colors.background-card}
label-focused-underline = ${colors.fluent-blue}
label-focused-padding = 0

label-occupied = " %icon% "
label-occupied-foreground = ${colors.foreground}
label-occupied-background = ${colors.background-alt}
label-occupied-padding = 0

label-urgent = " %icon% "
label-urgent-foreground = ${colors.white}
label-urgent-background = ${colors.alert}
label-urgent-padding = 0

label-empty = " %icon% "
label-empty-foreground = #555555
label-empty-background = ${colors.background}
label-empty-padding = 0


[module/win11-explorer]
type = custom/text
label = " 󰉋 "
label-font = 2
label-foreground = #e5c07b
label-padding = 1
click-left = /home/rodrigo47363/.local/bin/file-explorer &

[module/win11-terminal]
type = custom/text
label = "  "
label-font = 2
label-foreground = #56b6c2
label-padding = 1
click-left = /opt/kitty/bin/kitty &

[module/win11-browser]
type = custom/text
label = " 󰈹 "
label-font = 2
label-foreground = #e06c75
label-padding = 1
click-left = firefox &

[module/win11-code]
type = custom/text
label = " 󰨞 "
label-font = 2
label-foreground = #61afef
label-padding = 1
click-left = codium &

[module/win11-dock-sep]
type = custom/text
label = " │ "
label-foreground = #383838

[module/win11-active]
type = internal/xwindow
label = " %title:0:22:...% "
label-empty = ""
label-foreground = ${colors.foreground}
label-background = ${colors.background-alt}
label-underline = ${colors.fluent-blue}
label-padding = 1

;==========================================================
; 3. ZONA DERECHA: BANDEJA, QUICK SETTINGS & RELOJ
;==========================================================

[module/tray-chevron]
type = custom/text
label = " 󰅃 "
label-foreground = ${colors.foreground-dim}
label-padding = 0

[module/systray]
type = internal/tray
tray-size = 55%
tray-spacing = 6px
tray-background = ${colors.background}
tray-padding = 1

[module/sep-pill]
type = custom/text
label = " "
label-padding = 0

[module/wlan]
type = internal/network
interface = wlp0s20f3
interval = 3.0

format-connected = " 󰤨 "
format-connected-background = ${colors.background-alt}
format-connected-foreground = ${colors.foreground}
format-connected-padding = 0

format-disconnected = " 󰤭 "
format-disconnected-background = ${colors.background-alt}
format-disconnected-foreground = ${colors.alert}
format-disconnected-padding = 0

click-left = bash ~/.config/polybar/scripts/wifi-menu.sh &

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false

format-volume = <ramp-volume>
format-volume-background = ${colors.background-alt}
format-volume-foreground = ${colors.foreground}
format-volume-padding = 0

label-volume = %percentage%%

label-muted = " 󰝟 "
label-muted-foreground = ${colors.alert}
label-muted-background = ${colors.background-alt}
label-muted-padding = 0

ramp-volume-0 = " 󰕿 "
ramp-volume-1 = " 󰖀 "
ramp-volume-2 = " 󰕾 "

click-left = /home/rodrigo47363/.local/bin/volume-slider &

[module/battery]
type = internal/battery
full-at = 98
low-at = 20
battery = BAT1
adapter = ACAD
poll-interval = 5

format-charging = <label-charging>
format-charging-background = ${colors.background-alt}
format-charging-foreground = ${colors.green}
label-charging = " 󰂄 %percentage%% "

format-discharging = <label-discharging>
format-discharging-background = ${colors.background-alt}
format-discharging-foreground = ${colors.foreground}
label-discharging = " 󰁹 %percentage%% "

format-full = <label-full>
format-full-background = ${colors.background-alt}
format-full-foreground = ${colors.green}
label-full = " 󰁹 100% "

[module/win11-clock]
type = internal/date
interval = 1

date = %d/%m/%Y
time = %I:%M %p

label = " %time%  %date% "
label-foreground = ${colors.foreground}
label-background = ${colors.background-alt}
label-padding = 1
click-left = ~/.config/polybar/scripts/win-calendar.sh &

[module/win11-notifications]
type = custom/text
label = " 󰂚 "
label-foreground = ${colors.foreground-alt}
label-background = ${colors.background-alt}
label-padding = 1
click-left = dunstctl history-pop &
click-right = dunstctl set-paused toggle &

[module/win11-show-desktop]
type = custom/text
label = " │ "
label-foreground = #383838
click-left = ~/.config/polybar/scripts/win-show-desktop.sh &

[settings]
screenchange-reload = true
pseudo-transparency = false
