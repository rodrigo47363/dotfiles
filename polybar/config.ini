;==========================================================
;   POLYBAR CONFIG - OFFENSIVE SECURITY & PENTESTING PRO
;==========================================================

[colors]
background = #1e222a
background-alt = #282c34
foreground = #abb2bf
foreground-alt = #e5e9f0
primary = #61afef
secondary = #56b6c2
red = #e06c75
green = #98c379
yellow = #e5c07b
purple = #c678dd
cyan = #56b6c2
disabled = #5c6370
white = #ffffff

[bar/parrot]
width = 100%
height = 24pt
radius = 0
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt
line-color = ${colors.primary}

padding-left = 1
padding-right = 1
module-margin = 1

separator = ""
separator-foreground = ${colors.disabled}

wm-restack = bspwm
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

; --- FUENTES ---
font-0 = "Cantarell:size=10:weight=bold;2"
font-1 = "Hack Nerd Font:size=11;2"
font-2 = "Iosevka Nerd Font:size=11;2"
font-3 = "feather:size=11;2"

; --- DISTRIBUCIÓN EQUILIBRADA DE MÓDULOS ---
modules-left = launcher bspwm xwindow
modules-center = target vpn pomodoro
modules-right = cpu temperature gpu memory backlight pulseaudio wlan eth battery date powermenu systray

;==========================================================
; MÓDULO LAUNCHER (ROFI)
;==========================================================
[module/launcher]
type = custom/text
label = "  󰀻  "
label-foreground = ${colors.primary}
label-background = ${colors.background-alt}
label-padding = 0
click-left = ~/.config/polybar/scripts/launcher &

;==========================================================
; MÓDULO BSPWM WORKSPACES
;==========================================================
[module/bspwm]
type = internal/bspwm

pin-workspaces = true
inline-mode = false
enable-click = true
enable-scroll = true
reverse-scroll = false

label-focused = %name%
label-focused-foreground = ${colors.white}
label-focused-background = ${colors.background-alt}
label-focused-underline = ${colors.primary}
label-focused-padding = 1

label-occupied = %name%
label-occupied-foreground = ${colors.foreground-alt}
label-occupied-padding = 1

label-urgent = %name%
label-urgent-foreground = ${colors.white}
label-urgent-background = ${colors.red}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

;==========================================================
; MÓDULO XWINDOW (VENTANA ACTIVA)
;==========================================================
[module/xwindow]
type = internal/xwindow
label = %title:0:30:...%
label-foreground = ${colors.secondary}
label-empty = Desktop
label-empty-foreground = ${colors.disabled}

;==========================================================
; MÓDULOS OFFENSIVE SECURITY (TARGET & VPN)
;==========================================================
[module/target]
type = custom/script
exec = ~/.config/polybar/scripts/target.sh
interval = 3
click-left = ~/.config/polybar/scripts/target.sh copy
click-right = ~/.config/polybar/scripts/target.sh clear
format = <label>
format-background = ${colors.background-alt}
format-padding = 1

[module/vpn]
type = custom/script
exec = ~/.config/polybar/scripts/vpn.sh
interval = 2
click-left = ~/.config/polybar/scripts/vpn.sh copy
format = <label>
format-background = ${colors.background-alt}
format-padding = 1

;==========================================================
; MÓDULOS DE SISTEMA & HARDWARE
;==========================================================
[module/filesystem]
type = internal/fs
mount-0 = /
interval = 30
label-mounted = %{F#56b6c2}󰋊%{F-} %percentage_used%%
label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/cpu]
type = internal/cpu
interval = 2
label = %{F#e5c07b}󰍛%{F-} %percentage:2%%

[module/temperature]
type = internal/temperature
thermal-zone = 7
warn-temperature = 75
interval = 2

format = <ramp> <label>
format-warn = <ramp> <label-warn>
format-warn-underline = ${colors.red}

label = %temperature-c%
label-foreground = ${colors.foreground}

label-warn = %temperature-c%
label-warn-foreground = ${colors.red}

ramp-0 = %{F#98c379}󰔏%{F-}
ramp-1 = %{F#e5c07b}󰔏%{F-}
ramp-2 = %{F#e06c75}󰔏%{F-}

[module/gpu]
type = custom/script
exec = ~/.config/polybar/scripts/gpu.sh
interval = 3
click-left = ~/.config/polybar/scripts/gpu.sh open
format = <label>

[module/memory]
type = internal/memory
interval = 2
label = %{F#c678dd}󰘚%{F-} %percentage_used%%

[module/backlight]
type = internal/backlight
card = intel_backlight
use-actual-brightness = true
enable-scroll = true
format = <label>
label = %{F#ebcb8b}󰃠%{F-} %percentage%%

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5

format-volume = <label-volume>
label-volume = %{F#61afef}󰕾%{F-} %percentage%%

label-muted = %{F#5c6370}󰖁 mute%{F-}
label-muted-foreground = ${colors.disabled}

click-right = pavucontrol &

;==========================================================
; MÓDULOS DE RED (WLAN / ETHERNET)
;==========================================================
[module/wlan]
type = internal/network
interface = wlp0s20f3
interval = 3

format-connected = %{A1:~/.config/polybar/scripts/wifi-menu.sh:}%{F#61afef}󰤨%{F-} <label-connected>%{A}
label-connected = %essid%
label-connected-foreground = ${colors.foreground}

format-disconnected = %{A1:~/.config/polybar/scripts/wifi-menu.sh:}%{F#5c6370}󰤭 off%{F-}%{A}

[module/eth]
type = internal/network
interface = enp7s0
interval = 3
format-connected = %{F#56b6c2}󰈀%{F-} <label-connected>
label-connected = %local_ip%
format-disconnected =

;==========================================================
; MÓDULO BATERÍA
;==========================================================
[module/battery]
type = internal/battery
full-at = 98
low-at = 20
battery = BAT1
adapter = ACAD
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <label-full>
format-low = <animation-low> <label-low>

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %{F#98c379}󰁹%{F-} %percentage%%
label-low = %{F#e06c75}󰂃%{F-} %percentage%%

ramp-capacity-0 = %{F#e06c75}󰂃%{F-}
ramp-capacity-1 = %{F#e5c07b}󰁺%{F-}
ramp-capacity-2 = %{F#e5c07b}󰁼%{F-}
ramp-capacity-3 = %{F#98c379}󰁾%{F-}
ramp-capacity-4 = %{F#98c379}󰁹%{F-}

animation-charging-0 = %{F#98c379}󰢜%{F-}
animation-charging-1 = %{F#98c379}󰂆%{F-}
animation-charging-2 = %{F#98c379}󰂈%{F-}
animation-charging-3 = %{F#98c379}󰂉%{F-}
animation-charging-4 = %{F#98c379}󰂄%{F-}
animation-charging-framerate = 750

animation-low-0 = %{F#e06c75}󰂃%{F-}
animation-low-1 = %{F#ffffff}󰂃%{F-}
animation-low-framerate = 500

;==========================================================
; MÓDULO FECHA & HORA
;==========================================================
[module/date]
type = internal/date
interval = 1

date = %d/%m/%Y
time = %I:%M %p

date-alt = %A, %d de %B de %Y
time-alt = %H:%M:%S

label = %{F#e5c07b}󰸗%{F-} %date%  %{F#61afef}󰅐%{F-} %time%
label-foreground = ${colors.foreground-alt}

;==========================================================
; MÓDULO POWERMENU
;==========================================================
[module/powermenu]
type = custom/menu
expand-right = true

label-open = " 󰐥 "
label-open-foreground = #ffffff
label-open-background = ${colors.red}
label-open-padding = 0

label-close = " 󰜺 cancelar "
label-close-foreground = ${colors.foreground}
label-close-background = ${colors.background-alt}
label-separator = " | "

menu-0-0 = " Reiniciar "
menu-0-0-exec = systemctl reboot
menu-0-1 = " Apagar "
menu-0-1-exec = systemctl poweroff

;==========================================================
; BANDEJA DEL SISTEMA (SYSTRAY)
;==========================================================
[module/systray]
type = internal/tray
tray-size = 60%
tray-spacing = 6px

;==========================================================
; MÓDULO POMODORO (POMOC)
;==========================================================
[module/pomodoro]
type = custom/script
exec = ~/.config/polybar/scripts/pomodoro.sh
interval = 1
click-left = ~/.config/polybar/scripts/pomodoro.sh toggle &
click-right = ~/.config/polybar/scripts/pomodoro.sh end &
click-middle = ~/.config/polybar/scripts/pomodoro.sh stop &

[settings]
screenchange-reload = true
pseudo-transparency = true
