;==========================================================
;   POLYBAR CONFIG - ULTIMATE PENTESTING & ACERSENSE PRO SUITE
;   Theme: One Dark & Cyberpunk Slate Hybrid
;==========================================================

[colors]
background = #141820
background-alt = #1e2430
background-card = #232936
foreground = #e6edf3
foreground-alt = #abb2bf
foreground-dim = #6e7681

primary = #61afef
secondary = #56b6c2
green = #98c379
red = #e06c75
yellow = #e5c07b
purple = #c678dd
cyan = #56b6c2
orange = #d19a66
disabled = #484f58
white = #ffffff

[bar/parrot]
width = 100%
height = 24pt
radius = 0
offset-x = 0
offset-y = 0
fixed-center = false

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt
line-color = ${colors.primary}

border-bottom-size = 1pt
border-bottom-color = ${colors.background-card}

padding-left = 1
padding-right = 1
module-margin = 1

separator = ""
separator-foreground = ${colors.disabled}

wm-restack = bspwm
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

; --- TIPOGRAFÍA Y FUENTES DE PRECISIÓN ---
font-0 = "Noto Sans:size=10:weight=bold;2"
font-1 = "Hack Nerd Font:size=11;2"
font-2 = "Iosevka Nerd Font:size=10:weight=bold;2"
font-3 = "feather:size=11;2"

; --- DISTRIBUCIÓN ERGONÓMICA Y BALANCEADA (PRO EDITION) ---
modules-left = launcher bspwm xwindow
modules-center = target vpn pomodoro
modules-right = acersense cpu gpu memory backlight pulseaudio wlan eth battery date powermenu systray

;==========================================================
; 1. ZONA IZQUIERDA: NAVEGACIÓN Y FOCO
;==========================================================

[module/launcher]
type = custom/text
label = " 󰀻 "
label-foreground = ${colors.background}
label-background = ${colors.primary}
label-padding = 0
click-left = ~/.config/polybar/scripts/launcher &

[module/bspwm]
type = internal/bspwm

pin-workspaces = true
inline-mode = false
enable-click = true
enable-scroll = true
reverse-scroll = false

label-focused = %name%
label-focused-foreground = ${colors.primary}
label-focused-background = ${colors.background-card}
label-focused-underline = ${colors.primary}
label-focused-padding = 1

label-occupied = %name%
label-occupied-foreground = ${colors.foreground}
label-occupied-background = ${colors.background-alt}
label-occupied-padding = 1

label-urgent = %name%
label-urgent-foreground = ${colors.white}
label-urgent-background = ${colors.red}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-background = ${colors.background}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = " 󰖯 %title:0:32:...% "
label-foreground = ${colors.secondary}
label-background = ${colors.background-alt}
label-empty = " 󰇄 Desktop "
label-empty-foreground = ${colors.disabled}
label-empty-background = ${colors.background-alt}

;==========================================================
; 2. ZONA CENTRAL: CIBERSEGURIDAD OFENSIVA & ENFOQUE
;==========================================================

[module/target]
type = custom/script
exec = ~/.config/polybar/scripts/target.sh
interval = 3
click-left = ~/.config/polybar/scripts/target.sh copy
click-right = ~/.config/polybar/scripts/target.sh clear
format = <label>
format-background = ${colors.background-card}
format-underline = ${colors.red}
format-padding = 1

[module/vpn]
type = custom/script
exec = ~/.config/polybar/scripts/vpn.sh
interval = 2
click-left = ~/.config/polybar/scripts/vpn.sh copy
format = <label>
format-background = ${colors.background-card}
format-underline = ${colors.cyan}
format-padding = 1

[module/pomodoro]
type = custom/script
exec = ~/.config/polybar/scripts/pomodoro.sh
interval = 1
click-left = ~/.config/polybar/scripts/pomodoro.sh toggle &
click-right = ~/.config/polybar/scripts/pomodoro.sh end &
click-middle = ~/.config/polybar/scripts/pomodoro.sh reset &
double-click-left = ~/.config/polybar/scripts/pomodoro.sh reset &
scroll-up = ~/.config/polybar/scripts/pomodoro.sh reset &
scroll-down = ~/.config/polybar/scripts/pomodoro.sh menu &
format = <label>
format-background = ${colors.background-card}
format-underline = ${colors.purple}
format-padding = 1

;==========================================================
; 3. ZONA DERECHA: HARDWARE, ACERSENSE & TELEMETRÍA
;==========================================================

[module/acersense]
type = custom/script
exec = ~/.config/polybar/scripts/acersense.sh
interval = 2
click-left = ~/.config/polybar/scripts/acersense.sh toggle
click-right = ~/.config/polybar/scripts/acersense.sh gui
format = <label>
format-background = ${colors.background-alt}
format-padding = 1

[module/cpu]
type = internal/cpu
interval = 2
label = %{F#e5c07b}󰍛%{F-} %percentage:2%%
format-background = ${colors.background-alt}
format-padding = 1
click-left = kitty -e btop &

[module/gpu]
type = custom/script
exec = ~/.config/polybar/scripts/gpu.sh
interval = 2
click-left = kitty -e btop &
format = <label>
format-background = ${colors.background-alt}
format-padding = 1

[module/memory]
type = internal/memory
interval = 2
label = %{F#c678dd}󰘚%{F-} %percentage_used%%
format-background = ${colors.background-alt}
format-padding = 1
click-left = kitty -e btop &

[module/backlight]
type = internal/backlight
card = intel_backlight
use-actual-brightness = true
enable-scroll = true
format = <label>
format-background = ${colors.background-alt}
format-padding = 1
label = %{F#ebcb8b}󰃠%{F-} %percentage%%

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = <label-volume>
format-volume-background = ${colors.background-alt}
format-volume-padding = 1
label-volume = %{F#61afef}󰕾%{F-} %percentage%%

format-muted = <label-muted>
format-muted-background = ${colors.background-alt}
format-muted-padding = 1
label-muted = %{F#5c6370}󰖁 mute%{F-}

click-right = pavucontrol &

;==========================================================
; 4. RED (WLAN / ETHERNET)
;==========================================================

[module/wlan]
type = internal/network
interface = wlp0s20f3
interval = 3

format-connected = %{A1:~/.config/polybar/scripts/wifi-menu.sh:}%{F#61afef}󰤨%{F-} <label-connected>%{A}
format-connected-background = ${colors.background-alt}
format-connected-padding = 1
label-connected = %essid:0:10:...%
label-connected-foreground = ${colors.foreground}

format-disconnected = %{A1:~/.config/polybar/scripts/wifi-menu.sh:}%{F#5c6370}󰤭 off%{F-}%{A}
format-disconnected-background = ${colors.background-alt}
format-disconnected-padding = 1

[module/eth]
type = internal/network
interface = enp7s0
interval = 3
format-connected = %{F#56b6c2}󰈀%{F-} <label-connected>
format-connected-background = ${colors.background-alt}
format-connected-padding = 1
label-connected = %local_ip%
format-disconnected =

;==========================================================
; 5. BATERÍA CON PROTECCIÓN AL 80% & HORA
;==========================================================

[module/battery]
type = internal/battery
full-at = 98
low-at = 20
battery = BAT1
adapter = ACAD
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-charging-background = ${colors.background-alt}
format-charging-padding = 1

format-discharging = <ramp-capacity> <label-discharging>
format-discharging-background = ${colors.background-alt}
format-discharging-padding = 1

format-full = <label-full>
format-full-background = ${colors.background-alt}
format-full-padding = 1

format-low = <animation-low> <label-low>
format-low-background = ${colors.background-alt}
format-low-padding = 1

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %{F#98c379}󰁹%{F-} %percentage%% [80%]
label-low = %{F#e06c75}󰂃%{F-} %percentage%%

ramp-capacity-0 = %{F#e06c75}󰂃%{F-}
ramp-capacity-1 = %{F#e5c07b}󰁺%{F-}
ramp-capacity-2 = %{F#e5c07b}󰁼%{F-}
ramp-capacity-3 = %{F#98c379}󰁾%{F-}
ramp-capacity-4 = %{F#98c379}󰁹%{F-}

animation-charging-0 = %{F#98c379}󰢜%{F-}
animation-charging-1 = %{F#98c379}󰂆%{F-}
animation-charging-2 = %{F#98c379}󰂈%{F-}
animation-charging-3 = %{F#98c379}󰂉%{F-}
animation-charging-4 = %{F#98c379}󰂄%{F-}
animation-charging-framerate = 750

animation-low-0 = %{F#e06c75}󰂃%{F-}
animation-low-1 = %{F#ffffff}󰂃%{F-}
animation-low-framerate = 500

[module/date]
type = internal/date
interval = 1

date = %d/%m
time = %I:%M %p

date-alt = %d/%m/%Y
time-alt = %H:%M:%S

label = %{F#e5c07b}󰸗%{F-} %date%  %{F#61afef}󰅐%{F-} %time%
label-foreground = ${colors.foreground}
format-background = ${colors.background-alt}
format-padding = 1

;==========================================================
; 6. MENÚ DE APAGADO & SYSTRAY
;==========================================================

[module/powermenu]
type = custom/text
label = " 󰐥 "
label-foreground = ${colors.white}
label-background = ${colors.red}
label-padding = 0
click-left = ~/.config/polybar/scripts/powermenu.sh &

[module/systray]
type = internal/tray
tray-size = 60%
tray-spacing = 6px
tray-background = ${colors.background-alt}
tray-padding = 1

[settings]
screenchange-reload = true
pseudo-transparency = false
