;==========================================================
;   POLYBAR CONFIG - WINDOWS 10 TASKBAR (METRO DESIGN)
;   Authentic bottom-docked Windows 10 taskbar replication
;==========================================================

[colors]
background      = #0c0c0c
background-alt  = #181818
background-active= #252525
foreground      = #ffffff
foreground-alt  = #d0d0d0
foreground-dim  = #767676

accent          = #0078d7
alert           = #e81123
green           = #107c10
white           = #ffffff

[bar/win10]
width = 100%
height = 28pt
radius = 0
bottom = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt
line-color = ${colors.accent}

border-top-size = 0pt

padding-left = 0
padding-right = 0
module-margin = 0

wm-restack = bspwm
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

; --- FUENTES OFICIALES WINDOWS 10 ---
font-0 = "Segoe UI:size=10;2"
font-1 = "Hack Nerd Font:size=11;2"
font-2 = "Segoe MDL2 Assets:size=11;2"
font-3 = "Hack Nerd Font:size=13;3"
font-4 = "Segoe Fluent Icons:size=11;2"

; --- DISTRIBUCIÓN ESTILO WINDOWS 10 (ALINEADO A LA IZQUIERDA) ---
modules-left = win10-start win10-search win10-taskview win10-bspwm win10-dock-sep win10-explorer win10-terminal win10-browser win10-code win10-active
modules-center = 
modules-right = tray-chevron systray win10-wlan win10-pulseaudio win10-battery win10-clock win10-action-center win10-show-desktop

;==========================================================
; 1. ZONA IZQUIERDA: BOTÓN INICIO, BÚSQUEDA & TAREAS
;==========================================================

[module/win10-start]
type = custom/text
label = " 󰍲 "
label-font = 4
label-foreground = ${colors.white}
label-background = ${colors.background}
label-padding = 1
click-left = pkill -x rofi || rofi -show drun &
click-right = pkill -x rofi || ~/.config/polybar/scripts/powermenu.sh &

[module/win10-search]
type = custom/text
label = "  %{T3}%{T-}  Escribe aquí para buscar          "
label-foreground = ${colors.foreground-dim}
label-background = ${colors.background-alt}
label-padding = 1
click-left = pkill -x rofi || rofi -show drun &

[module/win10-taskview]
type = custom/text
label = " 󱂬 "
label-font = 2
label-foreground = ${colors.foreground-alt}
label-padding = 1
click-left = pkill -x rofi || rofi -show window &

[module/win10-bspwm]
type = internal/bspwm

pin-workspaces = true
inline-mode = false
enable-click = true
enable-scroll = true
reverse-scroll = false

ws-icon-0 = I;1
ws-icon-1 = II;2
ws-icon-2 = III;3
ws-icon-3 = IV;4
ws-icon-4 = V;5
ws-icon-5 = VI;6
ws-icon-6 = VII;7
ws-icon-7 = VIII;8
ws-icon-8 = IX;9
ws-icon-9 = X;10

format = <label-state>

label-focused = " %icon% "
label-focused-foreground = ${colors.white}
label-focused-background = ${colors.background-active}
label-focused-underline = ${colors.accent}
label-focused-padding = 0

label-occupied = " %icon% "
label-occupied-foreground = ${colors.foreground}
label-occupied-background = ${colors.background-alt}
label-occupied-padding = 0

label-urgent = " %icon% "
label-urgent-foreground = ${colors.white}
label-urgent-background = ${colors.alert}
label-urgent-padding = 0

label-empty = " %icon% "
label-empty-foreground = #454545
label-empty-background = ${colors.background}
label-empty-padding = 0

[module/win10-dock-sep]
type = custom/text
label = " │ "
label-foreground = #333333


[module/win10-explorer]
type = custom/text
label = " 󰉋 "
label-font = 2
label-foreground = #e5c07b
label-padding = 1
click-left = /home/rodrigo47363/.local/bin/file-explorer &
click-right = /home/rodrigo47363/.local/bin/file-explorer ~/Downloads &

[module/win10-terminal]
type = custom/text
label = "  "
label-font = 2
label-foreground = #56b6c2
label-padding = 1
click-left = /opt/kitty/bin/kitty &
click-right = bspc rule -a kitty -o state=floating && /opt/kitty/bin/kitty &

[module/win10-browser]
type = custom/text
label = " 󰈹 "
label-font = 2
label-foreground = #e06c75
label-padding = 1
click-left = firefox &
click-right = firefox --private-window &

[module/win10-code]
type = custom/text
label = " 󰨞 "
label-font = 2
label-foreground = #61afef
label-padding = 1
click-left = codium &
click-right = codium --new-window &

[module/win10-active]
type = internal/xwindow
label = "  %title:0:28:...%  "
label-empty = ""
label-foreground = ${colors.foreground}
label-background = ${colors.background-active}
label-underline = ${colors.accent}
label-padding = 1

;==========================================================
; 2. ZONA DERECHA: BANDEJA, RED, AUDIO & ACTION CENTER
;==========================================================

[module/tray-chevron]
type = custom/text
label = " 󰅃 "
label-foreground = ${colors.foreground-dim}
label-padding = 1
click-left = ~/.config/polybar/scripts/powermenu.sh &

[module/systray]
type = internal/tray
tray-size = 55%
tray-spacing = 6px
tray-background = ${colors.background}
tray-padding = 1

[module/win10-wlan]
type = internal/network
interface = wlp0s20f3
interval = 3.0

format-connected = "%{A1:~/.config/polybar/scripts/wifi-menu.sh &:}%{A2:~/.config/polybar/scripts/wifi-menu.sh nmtui &:}%{A3:~/.config/polybar/scripts/wifi-menu.sh toggle &:} 󰤨 %{A}%{A}%{A}"
format-connected-foreground = ${colors.foreground}
format-connected-padding = 1

format-disconnected = "%{A1:~/.config/polybar/scripts/wifi-menu.sh &:}%{A2:~/.config/polybar/scripts/wifi-menu.sh nmtui &:}%{A3:~/.config/polybar/scripts/wifi-menu.sh toggle &:} 󰤭 %{A}%{A}%{A}"
format-disconnected-foreground = ${colors.alert}
format-disconnected-padding = 1

format-packetloss = "%{A1:~/.config/polybar/scripts/wifi-menu.sh &:}%{A2:~/.config/polybar/scripts/wifi-menu.sh nmtui &:}%{A3:~/.config/polybar/scripts/wifi-menu.sh toggle &:} 󰤨 %{A}%{A}%{A}"
format-packetloss-foreground = ${colors.alert}
format-packetloss-padding = 1

[module/win10-pulseaudio]
type = internal/pulseaudio
use-ui-max = false

format-volume = "%{A1:/home/rodrigo47363/.local/bin/volume-slider &:}%{A2:/home/rodrigo47363/.local/bin/volume mute:}%{A3:pkill -f 'kitty -e alsamixer' || /opt/kitty/bin/kitty -e alsamixer &:}%{A4:/home/rodrigo47363/.local/bin/volume up:}%{A5:/home/rodrigo47363/.local/bin/volume down:}<ramp-volume>%{A}%{A}%{A}%{A}%{A}"
format-volume-foreground = ${colors.foreground}
format-volume-padding = 1

ramp-volume-0 = " 󰕿 "
ramp-volume-1 = " 󰖀 "
ramp-volume-2 = " 󰕾 "

format-muted = "%{A1:/home/rodrigo47363/.local/bin/volume-slider &:}%{A2:/home/rodrigo47363/.local/bin/volume mute:}%{A3:pkill -f 'kitty -e alsamixer' || /opt/kitty/bin/kitty -e alsamixer &:}%{A4:/home/rodrigo47363/.local/bin/volume up:}%{A5:/home/rodrigo47363/.local/bin/volume down:}<label-muted>%{A}%{A}%{A}%{A}%{A}"
format-muted-foreground = ${colors.alert}
format-muted-padding = 1

label-muted = " 󰝟 "
label-muted-foreground = ${colors.alert}
label-muted-padding = 1

[module/win10-battery]
type = internal/battery
full-at = 98
low-at = 20
battery = BAT1
adapter = ACAD
poll-interval = 5

format-charging = <label-charging>
format-charging-background = ${colors.background}
format-charging-foreground = ${colors.green}
label-charging = "%{A1:~/.config/polybar/scripts/acersense.sh gui &:}%{A3:~/.config/polybar/scripts/acersense.sh battery &:} 󰂄 %percentage%% %{A}%{A}"

format-discharging = <label-discharging>
format-discharging-background = ${colors.background}
format-discharging-foreground = ${colors.foreground}
label-discharging = "%{A1:~/.config/polybar/scripts/acersense.sh gui &:}%{A3:~/.config/polybar/scripts/acersense.sh battery &:} 󰁹 %percentage%% %{A}%{A}"

format-full = <label-full>
format-full-background = ${colors.background}
format-full-foreground = ${colors.green}
label-full = "%{A1:~/.config/polybar/scripts/acersense.sh gui &:}%{A3:~/.config/polybar/scripts/acersense.sh battery &:} 󰁹 100% %{A}%{A}"

[module/win10-clock]
type = internal/date
interval = 1

date = %d/%m/%Y
time = %H:%M

label = "%{A1:~/.config/polybar/scripts/win-calendar.sh &:}%{A3:~/.config/polybar/scripts/win-calendar.sh info &:} %time%   %date% %{A}%{A}"
label-foreground = ${colors.foreground}
label-padding = 1

[module/win10-action-center]
type = custom/text
label = " 󰍩 "
label-foreground = ${colors.foreground}
label-padding = 1
click-left = dunstctl history-pop &
click-right = dunstctl set-paused toggle &

[module/win10-show-desktop]
type = custom/text
label = "▏"
label-foreground = #444444
label-padding = 0
click-left = ~/.config/polybar/scripts/win-show-desktop.sh &

[settings]
screenchange-reload = true
pseudo-transparency = false
